<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Section</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- Your CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-logo">
                LifeOS
            </div>

            <nav class="sidebar-nav">

                <a href="#">
                    🏠 Dashboard
                </a>

                <a href="#">
                    📅 My Day
                </a>

                <a href="#" class="active">
                    🎯 Goals
                </a>

                <a href="#">
                    📚 Study
                </a>

                <a href="#">
                    📁 Projects
                </a>

                <a href="#">
                    📊 Progress
                </a>

                <a href="#">
                    🤖 AI Agent
                </a>

            </nav>

            <div class="sidebar-bottom">

                <a href="#">
                    ⚙ Settings
                </a>

            </div>

        </aside>

       <section class="task-container">

    <div class="task-content">

        <div class="task-header">
            <div>
                <h1>Today's Tasks</h1>
                <p>Stay focused and get things done.</p>
            </div>

            <span class="Date">16 September 2026</span>
        </div>


        <div class="progression-section">

            <div class="progress-info">
                <span>Progress</span>
                <span>3/6 completed tasks</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

        </div>


        <div class="task-heading">
            <h2>My Tasks</h2>

            <button class="add-task">
                + Add Task
            </button>
        </div>

    <div class="task_list">
    {% for task in tasks %}
        <div class="task-item">
            <input
                type="checkbox"
                id="task{{ task['id'] }}"
                data-task-id="{{ task['id'] }}"
                {% if task['is_completed'] %}checked{% endif %}
            >

            <label for="task{{ task['id'] }}">
                {{ task["title"] }}
            </label>
        </div>
    {% endfor %}
</div>
       

        <div class="daily-review">

            <h2>Daily Review</h2>

            <label for="review">What did you accomplish today?</label>

            <textarea id="review"
                placeholder="Write a few thoughts about your day..."></textarea>

        </div>

    </div>

</section> 


<!---JAVASCRIPT-->
 <script  src="/static/js/script.js"></script>

        </body>

</html>
